<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coaching PTM Portal - Google Sheets Connected</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Student List Sidebar */
        .sidebar {
            width: 300px;
            background-color: #34495e;
            color: white;
            overflow-y: auto;
            padding: 10px;
        }

        .sidebar h3 {
            padding: 10px;
            border-bottom: 1px solid #4f5d73;
            text-align: center;
            margin-bottom: 10px;
        }

        .student-item {
            padding: 12px 15px;
            border-bottom: 1px solid #4f5d73;
            cursor: pointer;
            transition: 0.2s;
            border-radius: 4px;
            margin-bottom: 5px;
        }

        .student-item:hover {
            background-color: #1abc9c;
        }

        /* Form Container */
        .form-container {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .form-card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-top: 5px solid #1abc9c;
            width: 100%;
            max-width: 700px;
        }

        h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        button {
            background-color: #1abc9c;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: 0.3s;
        }

        button:hover {
            background-color: #16a085;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        #status-message {
            margin-top: 15px;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            border-radius: 4px;
            display: none;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
        }

        .loading {
            background-color: #fff3cd;
            color: #856404;
        }
    </style>
</head>

<body>

    <header>🏫 Coaching PTM Management Portal</header>

    <div class="main-container">
        <!-- Sidebar: Student List -->
        <div class="sidebar">
            <h3>बच्चों की सूची (30 Students)</h3>
            <div id="student-list"></div>
        </div>

        <!-- Main Content: Form -->
        <div class="form-container">
            <div class="form-card">
                <h2>PTM फीडबैक फॉर्म (Google Sheet कनेक्टेड)</h2>
                <form id="ptm-form">
                    <div class="form-group">
                        <label>बच्चे का नाम (Student Name)</label>
                        <input type="text" id="student_name" readonly placeholder="बाईं तरफ से बच्चा चुनें"
                            style="background:#e9ecef; font-weight:bold;">
                    </div>

                    <div class="form-group">
                        <label>अभिभावक का नाम (Parent Name)</label>
                        <input type="text" id="parent_name" required placeholder="माता/पिता का नाम दर्ज करें">
                    </div>

                    <div class="form-group">
                        <label>डिटेल्स फीडबैक (General Feedback)</label>
                        <textarea id="feedback" required placeholder="बच्चे का ओवरऑल परफॉर्मेंस कैसा है?"></textarea>
                    </div>

                    <div class="form-group">
                        <label>कमजोरियां (Weak Points / Improvement Needed)</label>
                        <textarea id="weak_points" required
                            placeholder="बच्चा किस विषय या चीज़ में कमजोर है?"></textarea>
                    </div>

                    <div class="form-group">
                        <label>शिकायतें (Complaints - if any)</label>
                        <textarea id="complaints" placeholder="कोचिंग या पेरेंट्स की तरफ से कोई शिकायत?"></textarea>
                    </div>

                    <div class="form-group">
                        <label>कोचिंग को लेकर पेरेंट्स की राय (Parents' Response)</label>
                        <textarea id="parents_opinion" required
                            placeholder="पेरेंट्स का कोचिंग के बारे में क्या कहना है?"></textarea>
                    </div>

                    <button type="submit" id="submit-btn">Google Sheet में सेव करें</button>
                </form>

                <div id="status-message"></div>
            </div>
        </div>
    </div>

    <script>
        // आपकी इमेज से लिए गए सभी 30 बच्चों की लिस्ट
        const students = [
            "ayush yadav", "Harsh Yadav", "Disha Yadav", "Peehoo Yadav", "Saurya Yadav",
            "Shivansh Yadav", "Aadarsh Yadav", "SHIV RAJ YADAV", "ayush yadav", "arpit yadav",
            "Anurag yadav", "rishabh pal", "ashish yadav", "ritwik pal", "aryan yadav",
            "Ayush Yadav", "hemant kumar", "Aditi Yadav", "Styam yadav", "pari",
            "rakesh yadav", "ansh", "Aman", "Lakshy yadav", "aman",
            "Ashu", "avnish", "YASH", "ATUL", "Aarav yadav"
        ];

        // यहाँ अपना GOOGLE WEB APP URL डालें
        const googleScriptUrl = "https://script.google.com/macros/s/AKfycbwYqTyV1YkZSA5Myt3XAjJRdWxX0vOvEAvi7k47U1CqDvovX3Aq6ypQ0JC-oItxfOlYkg/exec";

        // साइडबार में छात्रों के नाम लोड करना
        const listContainer = document.getElementById('student-list');
        students.forEach((student, index) => {
            const div = document.createElement('div');
            div.className = 'student-item';
            div.innerText = `${index + 1}. ${student}`;
            div.onclick = () => selectStudent(student);
            listContainer.appendChild(div);
        });

        function selectStudent(name) {
            document.getElementById('student_name').value = name;
            document.getElementById('parent_name').focus();
        }

        // गूगल शीट में डेटा भेजने का फंक्शन
        document.getElementById('ptm-form').addEventListener('submit', function (e) {
            e.preventDefault();

            const studentName = document.getElementById('student_name').value;
            if (!studentName) {
                alert("कृपया पहले बाईं सूची से एक छात्र का चयन करें!");
                return;
            }

            const submitBtn = document.getElementById('submit-btn');
            const statusMsg = document.getElementById('status-message');

            // बटन को डिसेबल और स्टेटस दिखाना
            submitBtn.disabled = true;
            statusMsg.className = 'loading';
            statusMsg.innerText = "डेटा Google Sheet में सेव हो रहा है, कृपया प्रतीक्षा करें...";
            statusMsg.style.display = 'block';

            const record = {
                student: studentName,
                parent: document.getElementById('parent_name').value,
                feedback: document.getElementById('feedback').value,
                weak: document.getElementById('weak_points').value,
                complaint: document.getElementById('complaints').value || "None",
                opinion: document.getElementById('parents_opinion').value
            };

            // API Call to Google Sheets
            fetch(googleScriptUrl, {
                method: 'POST',
                mode: 'no-cors', // सुरक्षा ब्लॉकिंग से बचने के लिए
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(record)
            })
                .then(() => {
                    statusMsg.className = 'success';
                    statusMsg.innerText = "सफलतापूर्वक Google Sheet में सेव कर दिया गया! ✅";
                    this.reset();
                    submitBtn.disabled = false;
                    setTimeout(() => { statusMsg.style.display = 'none'; }, 3000);
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert("डेटा सेव करने में समस्या आई, कृपया अपना Web App URL चेक करें।");
                    submitBtn.disabled = false;
                    statusMsg.style.display = 'none';
                });
        });
    </script>

</body>

</html>
