<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coaching PTM Portal - 100% Complete & Responsive</title>
    <style>
        /* CSS Reset and Base Styles */
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Layout Container */
        .main-container {
            display: flex;
            flex: 1;
            flex-direction: row;
            overflow: hidden;
        }

        /* Desktop Sidebar View */
        .sidebar {
            width: 300px;
            background-color: #34495e;
            color: white;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .sidebar h3 {
            padding-bottom: 10px;
            border-bottom: 1px solid #4f5d73;
            text-align: center;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .mobile-select-wrapper {
            display: none;
        }

        .student-list-container {
            overflow-y: auto;
            flex: 1;
        }

        .student-item {
            padding: 12px 15px;
            border-bottom: 1px solid #4f5d73;
            cursor: pointer;
            transition: 0.2s;
            border-radius: 4px;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .student-item:hover {
            background-color: #1abc9c;
        }

        /* Form & Form Wrapper Styles */
        .form-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #fff;
            display: flex;
            justify-content: center;
        }

        .form-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border-top: 5px solid #1abc9c;
            width: 100%;
            max-width: 650px;
        }

        h2 {
            margin-bottom: 20px;
            color: #2c3e50;
            font-size: 18px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            background-color: #fff;
        }

        textarea {
            resize: vertical;
            height: 90px;
        }

        input[readonly] {
            background-color: #e9ecef;
            font-weight: bold;
            color: #2c3e50;
            cursor: not-allowed;
        }

        /* Buttons and Status Alerts */
        button {
            background-color: #1abc9c;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #16a085;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        #status-message {
            margin-top: 15px;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            border-radius: 6px;
            display: none;
            font-size: 14px;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .loading {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        /* Mobile Layout Modifications via Media Queries */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
                overflow: visible;
            }

            .sidebar {
                width: 100%;
                max-height: none;
                padding: 15px;
                border-bottom: 1px solid #ddd;
                background-color: #2c3e50;
            }

            .sidebar h3 {
                display: none;
            }

            .student-list-container {
                display: none;
            }

            .mobile-select-wrapper {
                display: block;
            }

            .mobile-select-wrapper label {
                color: white;
                margin-bottom: 8px;
                font-size: 15px;
            }

            .form-container {
                padding: 15px;
                overflow: visible;
            }

            .form-card {
                padding: 15px;
                box-shadow: none;
                border: 1px solid #eee;
            }

            header {
                font-size: 18px;
                padding: 12px;
            }

            button {
                padding: 16px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <header>🏫 Coaching PTM Portal</header>

    <div class="main-container">
        <!-- Sidebar / Selector Section -->
        <div class="sidebar">
            <h3>बच्चों की सूची (30 Students)</h3>

            <!-- Dropdown for Mobile Phones -->
            <div class="mobile-select-wrapper">
                <label for="mobile-student-select">📱 पहले यहाँ से बच्चा चुनें (Select Student):</label>
                <select id="mobile-student-select" onchange="selectStudent(this.value)">
                    <option value="">-- बच्चा चुनें / Select Student --</option>
                </select>
            </div>

            <!-- Sidebar List for Desktop Computers -->
            <div class="student-list-container" id="student-list"></div>
        </div>

        <!-- PTM Feedback Entry Form -->
        <div class="form-container">
            <div class="form-card">
                <h2>PTM फीडबैक फॉर्म</h2>
                <form id="ptm-form">
                    <div class="form-group">
                        <label>चुना गया बच्चा (Selected Student)</label>
                        <input type="text" id="student_name" readonly placeholder="सूची या ड्रॉपडाउन से बच्चा चुनें">
                    </div>

                    <div class="form-group">
                        <label>अभिभावक का नाम (Parent Name)</label>
                        <input type="text" id="parent_name" required placeholder="माता/पिता का नाम दर्ज करें">
                    </div>

                    <div class="form-group">
                        <label>डिटेल्स फीडबैक (General Feedback)</label>
                        <textarea id="feedback" required placeholder="बच्चे का ओवरऑल परफॉर्मेंस कैसा है?"></textarea>
                    </div>

                    <div class="form-group">
                        <label>कमजोरियां (Weak Points)</label>
                        <textarea id="weak_points" required
                            placeholder="बच्चा किस विषय या चीज़ में कमजोर है?"></textarea>
                    </div>

                    <div class="form-group">
                        <label>शिकायतें (Complaints - if any)</label>
                        <textarea id="complaints" placeholder="कोई शिकायत है तो यहाँ लिखें..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>कोचिंग को लेकर पेरेंट्स की राय (Parents' Response)</label>
                        <textarea id="parents_opinion" required
                            placeholder="पेरेंट्स का कोचिंग के बारे में क्या कहना है?"></textarea>
                    </div>

                    <button type="submit" id="submit-btn">🚀 Google Sheet में सेव करें</button>
                </form>

                <div id="status-message"></div>
            </div>
        </div>
    </div>
    <script>
        // 30 Students Data Base Array
        const students = [
            "ayush yadav", "Harsh Yadav", "Disha Yadav", "Peehoo Yadav", "Saurya Yadav",
            "Shivansh Yadav", "Aadarsh Yadav", "SHIV RAJ YADAV", "ayush yadav", "arpit yadav",
            "Anurag yadav", "rishabh pal", "ashish yadav", "ritwik pal", "aryan yadav",
            "Ayush Yadav", "hemant kumar", "Aditi Yadav", "Styam yadav", "pari",
            "rakesh yadav", "ansh", "Aman", "Lakshy yadav", "aman",
            "Ashu", "avnish", "YASH", "ATUL", "Aarav yadav"
        ];

        // ⚠️ यहाँ अपना गूगल वेब एप URL पेस्ट करें
        const googleScriptUrl = "https://script.google.com/macros/s/AKfycbwmeGAMcnwtMJOPJw1LfjsVm4TagQWrvBXG-3jlmWhMyaVePLRj_AbbdVMDUoICKaz5Zw/exec";

        const listContainer = document.getElementById('student-list');
        const mobileSelect = document.getElementById('mobile-student-select');

        // Rendering student interface elements for both desktop list & mobile dropdown
        students.forEach((student, index) => {
            const displayLabel = `${index + 1}. ${student}`;

            // Setup Desktop List Structure
            const div = document.createElement('div');
            div.className = 'student-item';
            div.innerText = displayLabel;
            div.onclick = () => selectStudent(student);
            listContainer.appendChild(div);

            // Setup Mobile Selector Dropdown Options
            const option = document.createElement('option');
            option.value = student;
            option.innerText = displayLabel;
            mobileSelect.appendChild(option);
        });

        // Synchronize selected student data across components
        function selectStudent(name) {
            document.getElementById('student_name').value = name;
            mobileSelect.value = name;

            if (name) {
                document.getElementById('parent_name').focus();
            }
        }

        // Submit handler package transferring parameters to Google Sheet webhook
        document.getElementById('ptm-form').addEventListener('submit', function (e) {
            e.preventDefault();

            const studentName = document.getElementById('student_name').value;
            if (!studentName) {
                alert("कृपया पहले एक छात्र का चयन करें!");
                return;
            }

            const submitBtn = document.getElementById('submit-btn');
            const statusMsg = document.getElementById('status-message');

            submitBtn.disabled = true;
            statusMsg.className = 'loading';
            statusMsg.innerText = "डेटा Google Sheet में सेव हो रहा है...";
            statusMsg.style.display = 'block';

            const record = {
                student: studentName,
                parent: document.getElementById('parent_name').value,
                feedback: document.getElementById('feedback').value,
                weak: document.getElementById('weak_points').value,
                complaint: document.getElementById('complaints').value || "None",
                opinion: document.getElementById('parents_opinion').value
            };

            fetch(googleScriptUrl, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(record)
            })
                .then(() => {
                    statusMsg.className = 'success';
                    statusMsg.innerText = "सफलतापूर्वक Google Sheet में सेव हो गया! ✅";
                    document.getElementById('ptm-form').reset();
                    mobileSelect.value = "";
                    submitBtn.disabled = false;

                    // Scroll to top for visibility on smaller devices
                    window.scrollTo({ top: 0, behavior: 'smooth' });

                    setTimeout(() => { statusMsg.style.display = 'none'; }, 3000);
                })
                .catch(error => {
                    console.error('Error Transmission:', error);
                    alert("सेव करने में समस्या आई, कृपया इंटरनेट कनेक्शन या URL चेक करें।");
                    submitBtn.disabled = false;
                    statusMsg.style.display = 'none';
                });
        });
    </script>

</body>

</html>
